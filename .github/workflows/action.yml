name: Action

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: action-${{ github.ref }}
  cancel-in-progress: true

jobs:
  action:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - id: gate
        uses: ./
        continue-on-error: true
        with:
          config: .github/jev-gates.yml
          mode: full
      - name: Fail unless the action failed closed without an API key
        if: steps.gate.outcome != 'failure'
        run: exit 1
